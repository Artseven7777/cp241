<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sorting Master Arena</title>

<style>

body{
font-family:Arial,sans-serif;
background:#1b1b1b;
color:white;
text-align:center;
margin:0;
padding:20px;
}

h1{
color:#4caf50;
}

button{
padding:10px 20px;
margin:5px;
border:none;
border-radius:8px;
cursor:pointer;
font-size:16px;
}

.menu button{
background:#4caf50;
color:white;
}

.array{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:10px;
margin:20px;
}

.box{
width:60px;
height:60px;
background:#2196f3;
display:flex;
justify-content:center;
align-items:center;
font-size:20px;
font-weight:bold;
border-radius:10px;
cursor:pointer;
transition:.2s;
}

.box:hover{
transform:scale(1.05);
}

.selected{
background:orange;
}

.panel{
border:1px solid #555;
padding:15px;
margin:15px;
border-radius:10px;
}

.correct{
color:lime;
}

.wrong{
color:red;
}

.win{
color:lime;
}

.lose{
color:#ff5252;
}

.gold{
color:gold;
}

.silver{
color:silver;
}

.bronze{
color:#cd7f32;
}

.stats{
display:flex;
justify-content:center;
gap:15px;
flex-wrap:wrap;
margin-bottom:15px;
}

.card{
background:#222;
padding:8px 16px;
border-radius:8px;
}

</style>
</head>

<body>

<h1>🎮 Sorting Master Arena</h1>

<div class="menu">

<button onclick="startSpeed()">
⏱ Speed Sort
</button>

<button onclick="startRace()">
🤖 Race Against AI
</button>

<button onclick="startQuiz()">
🧠 Choose Algorithm
</button>

</div>

<div id="game"></div>

<script>

let speedTimer=null;
let raceTimer=null;

let highScore=
parseInt(
localStorage.getItem("sortingHighScore")
) || 0;

function randomArray(size=8){

let arr=[];

while(arr.length<size){

let n=Math.floor(
Math.random()*90
)+10;

if(!arr.includes(n)){
arr.push(n);
}

}

return arr;

}

function isSorted(arr){

for(let i=0;i<arr.length-1;i++){

if(arr[i]>arr[i+1]){
return false;
}

}

return true;

}

function drawArray(
containerId,
arr,
clickHandler=null,
selected=[]
){

const c=
document.getElementById(containerId);

c.innerHTML="";

arr.forEach((num,index)=>{

const div=
document.createElement("div");

div.className="box";

if(selected.includes(index)){
div.classList.add("selected");
}

div.textContent=num;

if(clickHandler){
div.onclick=
()=>clickHandler(index);
}

c.appendChild(div);

});

}

/* Bubble Sort */
function bubbleSteps(arr){

let a=[...arr];
let steps=[];

for(let i=0;i<a.length-1;i++){

for(let j=0;j<a.length-i-1;j++){

if(a[j]>a[j+1]){

[a[j],a[j+1]]
=
[a[j+1],a[j]];

steps.push([...a]);

}

}

}

return steps;

}

/* Selection Sort */
function selectionSteps(arr){

let a=[...arr];
let steps=[];

for(let i=0;i<a.length-1;i++){

let min=i;

for(let j=i+1;j<a.length;j++){

if(a[j]<a[min]){
min=j;
}

}

if(min!==i){

[a[i],a[min]]
=
[a[min],a[i]];

steps.push([...a]);

}

}

return steps;

}

function startSpeed(){

clearInterval(speedTimer);

let arr=randomArray();

let selected=[];

let time=0;
let moves=0;

let gameFinished=false;

document.getElementById("game").innerHTML=`

<div class="panel">

<h2>⏱ Speed Sort</h2>

<div class="stats">

<div class="card">
Time:
<span id="timer">0</span>
</div>

<div class="card">
Moves:
<span id="moves">0</span>
</div>

<div class="card">
High Score:
${highScore}
</div>

</div>

<div
id="speedArray"
class="array">
</div>

<div id="result"></div>

<button onclick="startSpeed()">
Restart
</button>

</div>
`;

speedTimer=setInterval(()=>{

if(gameFinished) return;

time++;

document.getElementById("timer")
.textContent=time;

},1000);

function clickBox(index){

if(gameFinished) return;

selected.push(index);

if(selected.length===2){

let a=selected[0];
let b=selected[1];

[arr[a],arr[b]]
=
[arr[b],arr[a]];

selected=[];

moves++;

document.getElementById("moves")
.textContent=moves;

draw();

if(isSorted(arr)){

gameFinished=true;

clearInterval(speedTimer);

let score=
Math.max(
1000-(time*10+moves*5),
0
);

if(score>highScore){

highScore=score;

localStorage.setItem(
"sortingHighScore",
score
);

}

let rank="Bronze";
let cls="bronze";

if(time<15){
rank="Gold";
cls="gold";
}
else if(time<30){
rank="Silver";
cls="silver";
}

document.getElementById(
"result"
).innerHTML=`

<h2 class="win">
🏆 Completed
</h2>

<h3>
Score: ${score}
</h3>

<h3 class="${cls}">
${rank}
</h3>

`;

}

}
else{

draw();

}

}

function draw(){

drawArray(
"speedArray",
arr,
clickBox,
selected
);

}

draw();

}
function startRace(){

clearInterval(raceTimer);

let player=randomArray();
let ai=[...player];

let selected=[];

let algo=Math.random()<0.5
? "Bubble Sort"
: "Selection Sort";

document.getElementById("game").innerHTML=`

<div class="panel">

<h2>🤖 Race Against AI</h2>

<p>
AI ใช้:
<b>${algo}</b>
</p>

<div style="margin-bottom:15px">

Difficulty :

<select id="difficulty">

<option value="easy">
🟢 Easy
</option>

<option value="medium" selected>
🟡 Medium
</option>

<option value="hard">
🔴 Hard
</option>

</select>

<button onclick="startRace()">
Apply Difficulty
</button>

</div>

<div style="
display:flex;
justify-content:space-around;
flex-wrap:wrap;
">

<div>

<h3>Player</h3>

<div
id="playerArray"
class="array">
</div>

</div>

<div>

<h3>AI</h3>

<div
id="aiArray"
class="array">
</div>

</div>

</div>

<div id="raceResult"></div>

<button onclick="startRace()">
Restart
</button>

</div>
`;

let steps=
algo==="Bubble Sort"
? bubbleSteps(ai)
: selectionSteps(ai);

let difficulty =
document.getElementById(
"difficulty"
).value;

let speed = 1500;

if(difficulty==="easy"){

speed = 2500;

steps =
steps.filter(
(_,i)=>i%3===0
);

}
else if(difficulty==="medium"){

speed = 1500;

steps =
steps.filter(
(_,i)=>i%2===0
);

}
else{

speed = 700;

}

let stepIndex=0;
let gameOver=false;

function drawAll(){

drawArray(
"playerArray",
player,
playerClick,
selected
);

drawArray(
"aiArray",
ai
);

}

function playerClick(index){

if(gameOver) return;

selected.push(index);

if(selected.length===2){

let a=selected[0];
let b=selected[1];

[player[a],player[b]]
=
[player[b],player[a]];

selected=[];

drawAll();

if(isSorted(player)){

gameOver=true;

clearInterval(raceTimer);

document.getElementById(
"raceResult"
).innerHTML=`

<h2 class="win">
🎉 YOU WIN
</h2>

`;

}

}
else{

drawAll();

}

}

raceTimer=setInterval(()=>{

if(gameOver) return;

if(stepIndex<steps.length){

ai=[...steps[stepIndex]];
stepIndex++;

drawAll();

}
else{

gameOver=true;

clearInterval(raceTimer);

document.getElementById(
"raceResult"
).innerHTML=`

<h2 class="lose">
🤖 AI WINS
</h2>

`;

}

},speed);

drawAll();

}
function countBubble(arr){

let a=[...arr];
let swaps=0;

for(let i=0;i<a.length-1;i++){

for(let j=0;j<a.length-i-1;j++){

if(a[j]>a[j+1]){

[a[j],a[j+1]]
=
[a[j+1],a[j]];

swaps++;

}

}

}

return swaps;

}

function countSelection(arr){

let a=[...arr];
let swaps=0;

for(let i=0;i<a.length-1;i++){

let min=i;

for(let j=i+1;j<a.length;j++){

if(a[j]<a[min]){
min=j;
}

}

if(min!==i){

[a[i],a[min]]
=
[a[min],a[i]];

swaps++;

}

}

return swaps;

}

function startQuiz(){

let data=randomArray(7);

let bubble=
countBubble(data);

let selection=
countSelection(data);

document.getElementById(
"game"
).innerHTML=`

<div class="panel">

<h2>
🧠 Choose Algorithm
</h2>

<p>
อัลกอริทึมใดใช้
Swap น้อยกว่า
</p>

<div
id="quizArray"
class="array">
</div>

<button
onclick="
answerQuiz('bubble')
">

Bubble Sort

</button>

<button
onclick="
answerQuiz('selection')
">

Selection Sort

</button>

<div id="result"></div>

</div>

`;

drawArray(
"quizArray",
data
);

window.answerQuiz=function(choice){

let correct=
selection<=bubble
?
"selection"
:
"bubble";

let result=
document.getElementById(
"result"
);

if(choice===correct){

result.innerHTML=`

<h2 class="correct">
✅ Correct
</h2>

<p>
Bubble Swap :
${bubble}
</p>

<p>
Selection Swap :
${selection}
</p>

`;

}
else{

result.innerHTML=`

<h2 class="wrong">
❌ Wrong
</h2>

<p>
Bubble Swap :
${bubble}
</p>

<p>
Selection Swap :
${selection}
</p>

`;

}

};

}
</script>

</body>

</html>
